name: Preview release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.target }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            executable: build/wireglass
          - target: windows-x64
            os: windows-latest
            executable: build/Release/wireglass.exe
          - target: macos
            os: macos-latest
            executable: build/wireglass
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage Unix package
        if: runner.os != 'Windows'
        run: |
          mkdir -p "stage/wireglass-${{ matrix.target }}"
          cp "${{ matrix.executable }}" "stage/wireglass-${{ matrix.target }}/wireglass"
          cp README.md LICENSE "stage/wireglass-${{ matrix.target }}/"
          tar -czf "wireglass-${{ matrix.target }}.tar.gz" -C stage "wireglass-${{ matrix.target }}"
      - name: Stage Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage/wireglass-${{ matrix.target }} | Out-Null
          Copy-Item "${{ matrix.executable }}" stage/wireglass-${{ matrix.target }}/wireglass.exe
          Copy-Item README.md,LICENSE stage/wireglass-${{ matrix.target }}/
          Compress-Archive -Path stage/wireglass-${{ matrix.target }} -DestinationPath wireglass-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wireglass-${{ matrix.target }}
          path: wireglass-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    needs: package
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: wireglass-*
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum *.tar.gz *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Rudy Wireglass ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: artifacts/*
