name: Preview release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Do not overlap publication attempts for the same release ref.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    name: Package ${{ matrix.target }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            executable: build/wireglass
          - target: windows-x64
            os: windows-latest
            executable: build/Release/wireglass.exe
          - target: macos
            os: macos-latest
            executable: build/wireglass
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage Unix package
        if: runner.os != 'Windows'
        run: |
          mkdir -p "stage/wireglass-${{ matrix.target }}"
          cp "${{ matrix.executable }}" "stage/wireglass-${{ matrix.target }}/wireglass"
          cp README.md LICENSE "stage/wireglass-${{ matrix.target }}/"
          tar -czf "wireglass-${{ matrix.target }}.tar.gz" -C stage "wireglass-${{ matrix.target }}"
      - name: Stage Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage/wireglass-${{ matrix.target }} | Out-Null
          Copy-Item "${{ matrix.executable }}" stage/wireglass-${{ matrix.target }}/wireglass.exe
          Copy-Item README.md,LICENSE stage/wireglass-${{ matrix.target }}/
          Compress-Archive -Path stage/wireglass-${{ matrix.target }} -DestinationPath wireglass-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wireglass-${{ matrix.target }}
          path: wireglass-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    needs: package
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          pattern: wireglass-*
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum *.tar.gz *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Rudy Wireglass ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: artifacts/*
